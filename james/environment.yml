name: datasci
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  # core stack
  - numpy
  - pandas
  - scipy
  # modeling
  - scikit-learn
  - statsmodels
  # visualization
  - matplotlib
  - seaborn
  - plotly
  # working environment
  - jupyterlab
  - ipykernel
  # data access
  - sqlalchemy
  - requests
  # linting and formatting
  - ruff
